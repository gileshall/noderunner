[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "noderunner"
version = "0.1.0"
description = "Run Docker containers on ephemeral Dataproc single-node clusters with gcsfuse mounts."
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
noderunner = "noderunner.__main__:cli"
